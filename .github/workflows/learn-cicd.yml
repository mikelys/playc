name: Learn CI/CD

# Feature branches and pull requests get CI. Only main can deploy.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and build demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cicd-demo
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install from lockfile
        run: npm ci

      - name: Test greeting behavior
        run: npm test

      - name: Build website
        run: npm run build

      - name: Upload tested website for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: cicd-demo/dist

  deploy:
    name: Deploy website
    # A failed check job blocks deployment through this dependency.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: learning-demo-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v4
